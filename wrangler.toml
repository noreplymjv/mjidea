# Cloudflare Workers + GitHub (static Astro)
# Dashboard uses: Build command None, Deploy: npx wrangler deploy, Root: /
# So static files MUST live in git: ./cf-dist

name = "mjidea"
compatibility_date = "2026-08-25"

[assets]
directory = "./cf-dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
